<style>
/* VOICE: utilitário, calmo, confiável — um relógio de ponto de bolso
   IDEA: o cartão de ponto de papel, com picotes e carimbo de hora
   PICTURE: o relógio grande do dia e a linha do tempo das 4 batidas
   COLOUR/TYPE: ink #0f1b24, papel branco, laranja carimbo #ff5a1f; Space Grotesk p/ horas, Inter p/ texto
   LAYOUT: coluna única de app, abas embaixo, folhas que sobem para o passo a passo */
:root{color-scheme:light dark;
--bg:light-dark(#eef0f2,#0b1319);--card:light-dark(#ffffff,#13212b);--ink:light-dark(#0f1b24,#e8eef2);
--mute:light-dark(#5b6873,#93a3ae);--line:light-dark(#dde2e6,#22333f);--acc:#ff5a1f;--acc-ink:#fff;
--ok:light-dark(#127a4a,#4fd197);--bad:light-dark(#b42318,#ff7a6e);--warn:light-dark(#9a6300,#f5b544);--soft:light-dark(#f6f7f8,#0f1b24)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;overflow-x:clip;
padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}

h2{font:700 21px/1.15 "Space Grotesk",Inter,sans-serif}
h3{font-size:16px;font-weight:600}
.mute{color:var(--mute)}.small{font-size:13px}
.banner{background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;text-align:center}
.banner b{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
.ticket{position:relative;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.ticket .top{position:relative;padding:20px 18px 16px;border-bottom:2px dashed var(--line)}
.ticket .top::before,.ticket .top::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--bg);bottom:-10px}
.ticket .top::before{left:-10px}.ticket .top::after{right:-10px}
.clock{font:700 clamp(54px,17vw,76px)/1 "Space Grotesk",sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.date{color:var(--mute);margin-top:4px;text-transform:capitalize}
.tl{list-style:none;margin:0;padding:6px 18px 14px}
.tl li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}

.steps li.ok{border-color:var(--ok)}.steps li.err{border-color:var(--bad)}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);white-space:nowrap}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.wk td{color:var(--mute)}

.scroll{overflow-x:auto}

.qrbox{display:grid;place-items:center;background:#fff;border-radius:16px;padding:16px;color:#0f1b24;text-align:center}
.qrbox img{width:min(260px,70vw);image-rendering:pixelated}
.hide{display:none!important}
.receipt{font-variant-numeric:tabular-nums}
.receipt .t{font:700 44px "Space Grotesk",sans-serif}
.hash{font:12px ui-monospace,Menlo,monospace;overflow-wrap:anywhere;color:var(--mute)}
details summary{cursor:pointer;font-weight:600}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:2px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mute);font-size:12px}.stack td:empty{display:none}}
@media print{nav.tabs,.banner,.noprint{display:none!important}body{background:#fff;color:#000;padding:0}.card{border:0;padding:0}}
</style>

<script>
{
/* ================= CONFIGURAÇÃO ================= */
// Quando o servidor do Google estiver publicado, cole a URL do Web App aqui.
const API_URL = "https://script.google.com/macros/s/AKfycbwCo2IwzgQx4w7VrYK0YxaHfZtJcI-rk7FoxGEb87dP4AeRsj6yE-CdKccoaBrjByyg/exec";
// Notificações (OneSignal): cole aqui o App ID quando a conta estiver criada.
const ONESIGNAL_APP_ID = "";
const TZ = "America/Sao_Paulo";
const VERSION = "1.0";

/* ================= UTIL ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = (() => { let mem = {}; return {
  get(k){ try{ const v = localStorage.getItem(k); return v==null? (mem[k]??null) : JSON.parse(v);}catch(e){ return mem[k]??null; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem(k);}catch(e){} } }; })();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const rnd = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => (b%36).toString(36)).join("");
async function sha256(t){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
const fmtParts = ts => { const p = {}; new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date(ts)).forEach(x=>p[x.type]=x.value); return p; };
const dayKey = ts => { const p = fmtParts(ts); return `${p.year}-${p.month}-${p.day}`; };
const hm = ts => { const p = fmtParts(ts); return `${p.hour}:${p.minute}`; };
const minOfDay = ts => { const p = fmtParts(ts); return (+p.hour)*60 + (+p.minute); };
const ymNow = () => dayKey(Date.now()).slice(0,7);
const toMin = s => { if(!s) return null; const [h,m] = s.split(":").map(Number); return h*60+m; };
const mm = m => { const s = m<0?"-":""; m = Math.abs(Math.round(m)); return `${s}${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`; };
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const ymLabel = ym => { const [y,m] = ym.split("-"); return `${MESES[m-1]} de ${y}`; };
const ymShift = (ym,d) => { let [y,m] = ym.split("-").map(Number); m += d; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return `${y}-${String(m).padStart(2,"0")}`; };
const TIPOS = ["Entrada","Saída p/ almoço","Volta do almoço","Saída"];
const tipoDe = n => n < 4 ? TIPOS[n] : (n % 2 === 0 ? "Entrada (extra)" : "Saída (extra)");
function distM(a,b,c,d){ const R=6371000, r=x=>x*Math.PI/180; const dLa=r(c-a), dLo=r(d-b); const h=Math.sin(dLa/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
// Regra da localização: dentro do raio = OK; GPS impreciso que pode estar dentro = vai para aprovação; claramente fora = bloqueia
function avaliaGeo(lat,lng,acc,loc){
  const dist = distM(lat,lng,loc.lat,loc.lng), raio = loc.raio||100; acc = acc||0;
  if(dist <= raio + Math.min(acc,50)) return {ok:true,status:"ok",dist};
  if(acc > 60 && dist - acc <= raio) return {ok:true,status:"pendente",dist};
  return {ok:false,dist,msg:`Fora do local de trabalho: você está a ${dist>=1000?(dist/1000).toFixed(1).replace(".",",")+" km":Math.round(dist)+" m"} da casa. O ponto só pode ser batido no local.`};
}
function loadScript(src){ return new Promise((ok,no)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>no(new Error("Não carregou "+src)); document.head.appendChild(s); }); }
const LIB = { xlsx:"https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" };
const DEVICE = store.get("pt_device") || (()=>{ const d = uid(); store.set("pt_device", d); return d; })();

/* ================= CÁLCULO DO ESPELHO (igual no servidor) ================= */
function jornadaDia(func, dow){ const j = func.jornada?.[dow]; if(!j || !j[0]) return null; return j; }
function esperado(j){ if(!j) return 0; const [e,si,vi,s] = j.map(toMin); if(si!=null && vi!=null && s!=null) return (si-e)+(s-vi); if(si!=null && s==null) return si-e; return (s??e)-e; }
function noturno(a,b){ // minutos entre 22:00 e 05:00 dentro de [a,b] (min do dia, pode passar de 1440)
  let t=0; for(let d=-1440; d<=1440; d+=1440){ const ranges=[[d+1320,d+1740]]; for(const [x,y] of ranges){ t += Math.max(0, Math.min(b,y)-Math.max(a,x)); } } return t; }
function espelho(func, batidas, ym, tol){
  const [Y,M] = ym.split("-").map(Number); const ult = new Date(Y, M, 0).getDate();
  const hoje = dayKey(Date.now());
  const porDia = {}; batidas.filter(b=>b.funcId===func.id && b.status!=="recusada").forEach(b=>{ (porDia[b.data] ||= []).push(b); });
  const dias = []; const tot = {trab:0,esp:0,extra:0,deb:0,not:0,faltas:0,alertas:0};
  for(let d=1; d<=ult; d++){
    const key = `${ym}-${String(d).padStart(2,"0")}`; const dow = new Date(Y,M-1,d).getDay();
    const j = jornadaDia(func,dow); const esp = esperado(j);
    const bs = (porDia[key]||[]).slice().sort((a,b)=>a.ts-b.ts);
    const mins = bs.map(b=>minOfDay(b.ts));
    let trab=0, not=0, obs=[], interv=null;
    for(let i=0;i+1<bs.length;i+=2){ let a=mins[i], b=mins[i+1]; if(b<a) b+=1440; trab+=b-a; not+=noturno(a,b); }
    if(bs.length>=3){ interv = mins[2]-mins[1]; }
    const futuro = key > hoje;
    if(bs.length%2===1 && key<hoje) obs.push("marcação ímpar");
    if(bs.length%2===1 && key===hoje) obs.push("em andamento");
    if(trab>360 && (interv==null || interv<60)) obs.push("intervalo < 1h");
    if(interv!=null && interv>120) obs.push("intervalo > 2h");
    let saldo = trab - esp; if(Math.abs(saldo) <= tol) saldo = 0;
    let extra=0, deb=0, falta=false;
    if(!futuro && key!==hoje){
      if(esp>0 && bs.length===0){ falta=true; deb=esp; obs.push("falta"); }
      else { extra=Math.max(0,saldo); deb=Math.max(0,-saldo); }
    } else if(key===hoje && bs.length%2===0 && bs.length>0){ extra=Math.max(0,saldo); }
    if(!j && bs.length) obs.push("dia sem jornada prevista");
    if(bs.some(b=>b.status==="pendente")) obs.push("localização a aprovar");
    if(obs.some(o=>o!=="em andamento")) tot.alertas++;
    tot.trab+=trab; if(!futuro) tot.esp+=esp; tot.extra+=extra; tot.deb+=deb; tot.not+=not; if(falta) tot.faltas++;
    dias.push({key,d,dow,j,esp,bs,trab,extra,deb,not,obs,futuro,interv});
  }
  tot.notReduz = Math.round(tot.not*60/52.5);
  return {dias,tot};
}
// Semana (segunda a domingo) até hoje + previsão até o fim da semana pela jornada contratada
function addDias(key,n){ const d = new Date(key+"T12:00:00-03:00"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function semana(func, batidas, tol, hojeKey){
  hojeKey = hojeKey || dayKey(Date.now());
  const dow = new Date(hojeKey+"T12:00:00-03:00").getUTCDay(); const seg = addDias(hojeKey, -((dow+6)%7));
  let trab=0, contratado=0, restante=0, diasLongos=[];
  for(let i=0;i<7;i++){
    const key = addDias(seg,i); const d = new Date(key+"T12:00:00-03:00").getUTCDay();
    const esp = esperado(jornadaDia(func,d)); contratado += esp;
    const bs = batidas.filter(b=>b.funcId===func.id && b.data===key && b.status!=="recusada").sort((a,b)=>a.ts-b.ts);
    let t=0; for(let k=0;k+1<bs.length;k+=2){ let a=minOfDay(bs[k].ts), b=minOfDay(bs[k+1].ts); if(b<a) b+=1440; t+=b-a; }
    if(bs.length%2===1 && key===hojeKey){ t += Math.max(0, minOfDay(Date.now())-minOfDay(bs[bs.length-1].ts)); }
    if(key<=hojeKey) trab += t;
    if(key>hojeKey) restante += esp; else if(key===hojeKey) restante += Math.max(0, esp - t);
    if(t > esp + 120 && esp>0) diasLongos.push(key);
  }
  const previsto = trab + restante; let estouro = previsto - contratado; if(Math.abs(estouro) <= tol) estouro = 0;
  return {seg, fim:addDias(seg,6), trab, contratado, previsto, estouro, saldoAteAgora: trab - (contratado - restante), diasLongos};
}
// Código de verificação do espelho: o mesmo no PDF do mês e no termo de confirmação
function chaveEspelho(E){ return JSON.stringify([E.dias.filter(d=>!d.futuro).map(d=>[d.key, d.bs.map(b=>b.hora+" "+b.tipo)]), [E.tot.trab,E.tot.extra,E.tot.deb,E.tot.faltas,E.tot.not]]); }
async function pegaIP(){ try{ const c = new AbortController(); setTimeout(()=>c.abort(),3000); const r = await fetch("https://api.ipify.org?format=json",{signal:c.signal}); return (await r.json()).ip; }catch(e){ return ""; } }
function refAlerta(funcs, batidas, tol, dia){
  const hoje = dayKey(Date.now());
  if(!DEMO || funcs.some(f=>semana(f,batidas,tol,hoje).trab>0)) return {ref:hoje, exemplo:false};
  const dw = new Date(hoje+"T12:00:00-03:00").getUTCDay(); const seg = addDias(hoje, -((dw+6)%7));
  return {ref:addDias(seg, -7 + ((+dia||4)-1)), exemplo:true};
}
function textoAlerta(funcs, batidas, tol, ref){
  const linhas = funcs.filter(f=>f.ativo).map(f=>{ const s = semana(f,batidas,tol,ref);
    let t = `• ${f.nome}: ${mm(s.trab)} trabalhadas de ${mm(s.contratado)} contratadas na semana. Previsão até domingo: ${mm(s.previsto)}.`;
    if(s.estouro>0) t += ` ⚠️ Estouro previsto de ${mm(s.estouro)} — dá para compensar liberando mais cedo nos próximos dias.`;
    else t += " Dentro do contratado.";
    if(s.diasLongos.length) t += ` Atenção: ${s.diasLongos.length} dia(s) com mais de 2h extras (limite legal diário).`;
    return t; });
  const s0 = semana(funcs[0]||{jornada:{}},[],0,ref);
  return `Ponto — semana de ${s0.seg.split("-").reverse().slice(0,2).join("/")} a ${s0.fim.split("-").reverse().slice(0,2).join("/")}\n\n${linhas.join("\n")}`;
}

/* ================= BACKEND: DEMONSTRAÇÃO (local) ================= */
const Demo = {
  key:"pt_demo_db4",
  db(){ let db = store.get(this.key); if(!db){ db = this.seed(); store.set(this.key, db);} return db; },
  save(db){ store.set(this.key, db); },
  seed(){
    const jPad = {0:null,1:["08:00","12:00","13:00","17:00"],2:["08:00","12:00","13:00","17:00"],3:["08:00","12:00","13:00","17:00"],4:["08:00","12:00","13:00","17:00"],5:["08:00","12:00","13:00","16:00"],6:null};
    const j2 = {0:null,1:["07:00","11:00","12:00","16:00"],2:["07:00","11:00","12:00","16:00"],3:["07:00","11:00","12:00","16:00"],4:["07:00","11:00","12:00","16:00"],5:["07:00","11:00","12:00","16:00"],6:["07:00","11:00",null,null]};
    const db = {

      locais:[{id:"casa",nome:"Casa principal",endereco:"Endereço a definir — Franco da Rocha/SP",lat:-23.3217,lng:-46.7266,raio:100}],

    const ini = ymShift(ymNow(),-1)+"-01"; const hoje = dayKey(Date.now());

  async rehash(db){ let prev="0"; for(const b of db.batidas){ if(!b.hash){ b.prev=prev; b.hash=await sha256([prev,b.id,b.funcId,b.ts,b.tipo,b.lat,b.lng].join("|")); } prev=b.hash; } },

      case "confirm": { const f = auth(); if(!(p.ym < ymNow())) throw new Error("Só dá para confirmar um mês já encerrado.");
        const ult = db.confirmacoes.filter(c=>c.funcId===f.id&&c.ym===p.ym).at(-1); if(ult && ult.acao!=="contestado") return ult;

      case "adminLogin": admin(); return true;
      case "adminAll": admin(); return {admin:{...db.admin,pin:undefined},locais:db.locais,funcs:db.funcs.map(f=>({...f,token:undefined})),batidas:db.batidas.filter(b=>(!p.ym || b.data.startsWith(p.ym)) && (!p.desde || b.data>=p.desde)),confirmacoes:db.confirmacoes};
      case "saveFunc": { admin(); const i = db.funcs.findIndex(f=>f.id===p.func.id); const cur = db.funcs[i]||{};
        const f = {...cur,...p.func}; if(!p.func.pin) f.pin = cur.pin; if(!f.id) f.id = "f"+rnd(6);

    }
    throw new Error("Ação desconhecida");
  }

function localAtual(){ return S.sess?.local || S.local || null; }
function setGeo(g){

    const local = {id:box.dataset.lid||undefined,nome:g("nome").value.trim(),endereco:g("endereco").value.trim(),lat:parseFloat(g("lat").value),lng:parseFloat(g("lng").value),raio:parseInt(g("raio").value)||100};
    if(!local.nome || isNaN(local.lat) || isNaN(local.lng)){ fm.querySelector(".msg").textContent="Preencha nome, latitude e longitude."; return; }
    try{ await api("saveLocal",{adminPin:S.adminPin,local}); viewAdmCadastro(); }catch(x){ fm.querySelector(".msg").textContent=x.message; } });
}
function funcForm(f,A){ return `<form style="margin-top:8px">
  <label>Nome completo</label><input name="nome" value="${esc(f.nome||"")}" autocomplete="off">
  <div class="row"><div><label>CPF</label><input name="cpf" inputmode="numeric" value="${esc(f.cpf||"")}"></div><div><label>Cargo</label><input name="cargo" value="${esc(f.cargo||"Funcionária")}"></div></div>
  <div class="row"><div><label>Local de trabalho</label><select name="localId">${A.locais.map(l=>`<option value="${esc(l.id)}" ${l.id===f.localId?"selected":""}>${esc(l.nome)}</option>`).join("")}</select></div>
  <div><label>${f.id?"Novo PIN (deixe vazio p/ manter)":"PIN (4 a 6 números)"}</label><input name="pin" inputmode="numeric" maxlength="6" autocomplete="off"></div></div>
  <label>Jornada contratada</label>${jorEditor(f)}
  <label class="row" style="color:var(--ink);font-size:15px;gap:8px"><input type="checkbox" name="ativo" ${f.ativo?"checked":""} style="flex:none"> Ativa</label>
  <p class="msg bad"></p>
  <div class="row"><button class="primary">Salvar</button>${f.id&&f.device?`<button type="button" data-reset="${esc(f.id)}">Liberar novo celular</button>`:""}</div></form>`; }
function localForm(l){ return `<form style="margin-top:8px">
  <label>Nome</label><input name="nome" value="${esc(l.nome||"")}">
  <label>Endereço</label><input name="endereco" value="${esc(l.endereco||"")}">
  <div class="row"><div><label>Latitude</label><input name="lat" inputmode="decimal" value="${l.lat??""}"></div><div><label>Longitude</label><input name="lng" inputmode="decimal" value="${l.lng??""}"></div><div><label>Raio (m)</label><input name="raio" inputmode="numeric" value="${l.raio??100}"></div></div>
  <button type="button" data-aqui style="width:100%;margin-top:10px">Estou na casa: usar a localização deste celular</button>
  <p class="small mute">Ou, no Google Maps, segure o dedo sobre a casa e copie os dois números que aparecem.</p>
  <p class="msg bad"></p>
  <div class="row"><button class="primary">Salvar</button></div></form>`; }
async function viewAdmSistema(){
  const A = await loadAdm(ymNow());
  $("#app").innerHTML = `<h1 style="margin-top:8px">Sistema</h1>
  <form class="card" id="fs">
    <label>Nome do empregador</label><input name="empregador" value="${esc(A.admin.empregador||"")}">
    <label>CPF do empregador</label><input name="cpfEmpregador" inputmode="numeric" value="${esc(A.admin.cpfEmpregador||"")}">
    <label>Tolerância diária (minutos) antes de contar extra ou atraso</label><input name="tolerancia" inputmode="numeric" value="${A.admin.tolerancia}">
    <label class="row" style="color:var(--ink);font-size:15px;gap:8px;margin-top:14px"><input type="checkbox" name="exigirSelfie" ${A.admin.exigirSelfie?"checked":""} style="flex:none"> Exigir selfie em cada batida</label>
    <h3 style="margin-top:18px">Alerta semanal de horas</h3>
    <p class="small mute">Avisa quando a previsão da semana passa do contratado, a tempo de compensar.</p>
    <div class="row"><div><label>Dia</label><select name="alertaDia">${[[3,"Quarta"],[4,"Quinta"],[5,"Sexta"]].map(([v,l])=>`<option value="${v}" ${+A.admin.alertaDia===v?"selected":""}>${l}</option>`).join("")}</select></div>
    <div><label>Hora</label><select name="alertaHora">${[8,12,16,18,20].map(v=>`<option value="${v}" ${+A.admin.alertaHora===v?"selected":""}>${v}h</option>`).join("")}</select></div></div>
    <label>E-mail (vazio = o da sua conta Google)</label><input name="email" type="email" value="${esc(A.admin.email||"")}">
    <label>Novo PIN do empregador (vazio = manter)</label><input name="newPin" type="password" inputmode="numeric" maxlength="8">
    <p class="msg" id="sm"></p><button class="primary">Salvar</button></form>
  ${pushCard("empregador","Alerta semanal de horas, batidas para aprovar e fechamento do mês. Ative neste celular (o seu).")}
  ${DEMO?"":`<form class="card" id="fpush"><h3>Chaves do OneSignal</h3><p class="small mute">${A.admin.pushAppId?"Configurado. Para trocar, preencha de novo.":"Cole aqui o App ID e a REST API Key da sua conta OneSignal."}</p>
    <label>App ID</label><input name="appId" autocomplete="off" value="${esc(A.admin.pushAppId||"")}"><label>REST API Key</label><input name="key" type="password" autocomplete="off" placeholder="${A.admin.pushKey?"(já salva)":""}">
    <p class="msg" id="pm"></p><button class="primary">Salvar chaves</button></form>`}
  <div class="card"><h3>Como as batidas são protegidas</h3>
    <ul class="small" style="padding-left:18px;margin:8px 0 0">
      <li>Só aceita dentro do raio do endereço. Com GPS impreciso, a batida entra marcada para sua aprovação.</li>
      <li>Selfie em cada batida, se você ligar a opção acima.</li>
      <li>Hora definida pelo servidor, não pelo celular.</li>
      <li>Cada funcionária fica presa ao próprio celular; trocar exige liberação aqui.</li>
      <li>Cada batida carrega um código ligado à anterior: apagar ou mudar uma quebra a sequência.</li>
    </ul></div>
  <div class="card"><h3>Situação</h3><p class="small mute">${DEMO?"Modo demonstração: tudo fica só neste aparelho. Ao conectar ao servidor do Google, os dados passam a ficar na sua planilha do Drive.":"Conectado ao servidor do Google."} · versão ${VERSION}</p>
  ${DEMO?`<button id="rd">Recomeçar demonstração</button>`:""}</div>`;
  pushBind("empregador");
  const fp = $("#fpush"); if(fp) fp.onsubmit = async e => { e.preventDefault(); try{ await api("setPush",{adminPin:S.adminPin,appId:fp.appId.value,key:fp.key.value}); PUSH_APP = fp.appId.value.trim(); $("#pm").textContent="Chaves salvas. Agora toque em Ativar avisos."; }catch(x){ $("#pm").textContent=x.message; } };
  $("#fs").onsubmit = async e => { e.preventDefault(); const g = n => e.target.querySelector(`[name=${n}]`);
    const cfg = {empregador:g("empregador").value.trim(),cpfEmpregador:g("cpfEmpregador").value.trim(),tolerancia:Math.max(0,parseInt(g("tolerancia").value)||0),exigirSelfie:g("exigirSelfie").checked,alertaDia:+g("alertaDia").value,alertaHora:+g("alertaHora").value,email:g("email").value.trim()};
    if(g("newPin").value) cfg.newPin = g("newPin").value;
    try{ await api("saveAdmin",{adminPin:S.adminPin,cfg}); if(cfg.newPin) S.adminPin = cfg.newPin; $("#sm").textContent="Salvo."; }catch(x){ $("#sm").textContent=x.message; } };
  const rd = $("#rd"); if(rd) rd.onclick = async ()=>{ await api("resetDemo"); store.del("pt_sess"); S.sess=null; S.adminPin=null; location.hash="#inicio"; route(); };
}

/* ================= ROTEADOR ================= */
function err(e){ $("#app").innerHTML = `<div class="card"><h2>Algo deu errado</h2><p class="msg bad">${esc(e.message)}</p><button id="rt">Tentar de novo</button></div>`; $("#rt").onclick=route; }
function sessErr(e){ store.del("pt_sess"); S.sess=null; err(e); }
function alertBox(m){ $("#panel").innerHTML = `<p>${esc(m)}</p><button class="big" id="ax">OK</button>`; $("#sheet").classList.add("open"); $("#ax").onclick=()=>$("#sheet").classList.remove("open"); }
$("#sheet").onclick = e => { if(e.target.id==="sheet" && !S.flow) $("#sheet").classList.remove("open"); };
let publicoCarregado = false;
async function route(){
  S.seq = (S.seq||0) + 1;
  if(!DEMO && !publicoCarregado){ publicoCarregado = true; api("publico").then(c=>{ if(c && c.pushAppId) PUSH_APP = c.pushAppId; }).catch(()=>{}); }
  const h = location.hash.slice(1) || "inicio";
  $("#banner").classList.toggle("hide", !DEMO);
  if(h.startsWith("empregador") && h!=="empregador" && !S.adminPin){ location.hash="#empregador"; return; }
  if(!h.startsWith("empregador")) S.adminPin = null;
  tabs();
  try{
    if(h==="mes") await viewMes();
    else if(h==="empregador") S.adminPin ? (location.hash="#empregador-hoje") : await viewAdminLogin();
    else if(h==="empregador-hoje") await viewAdmHoje();
    else if(h==="empregador-espelho") await viewAdmEspelho();
    else if(h==="empregador-cadastro") await viewAdmCadastro();
    else if(h==="empregador-sistema") await viewAdmSistema();
    else await viewInicio();
  }catch(e){ err(e); }
  if(DEMO && !S.local && S.sess){ const db = Demo.db(); const f = db.funcs.find(x=>x.id===S.sess.funcId); S.local = db.locais.find(l=>l.id===f?.localId); }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
}
</script>
